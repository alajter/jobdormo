# Recommended setup: only Postgres runs in Docker; the app runs natively with
# `npm run dev` (it renders CV PDFs with your local Chrome).
#   docker compose -f docker-compose.local.yml up -d
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: jobdormo_db
    environment:
      - POSTGRES_USER=jobdormo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=jobdormo
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql
    restart: unless-stopped
volumes:
  pgdata_local:
    name: jobdormo_pgdata
